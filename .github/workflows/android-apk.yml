# 놀맵 안드로이드 테스트 APK 자동 빌드
# android/ 폴더가 바뀌거나, Actions 탭에서 "Run workflow"를 누르면 실행돼요.
# 결과물(APK, 서명 지문, 빌드 로그)은 'apk' 브랜치와 'test-apk' 릴리스에 올라가요.
name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (API 36)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Collect output
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || echo "no log" > out/build.log
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk out/nolmap-test.apk
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
              -storepass android -keypass android | grep -E "SHA256|SHA-256" > out/fingerprint.txt || true
            echo "ok" > out/status.txt
          else
            echo "failed" > out/status.txt
          fi
          echo "commit: ${GITHUB_SHA}" >> out/status.txt
          date -u >> out/status.txt

      - name: Publish to 'apk' branch
        if: always()
        run: |
          cd out
          git init -q
          git checkout -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "APK build for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete test-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create test-apk out/nolmap-test.apk \
            --title "놀맵 테스트 APK" \
            --notes "테스트용 APK예요 (플레이스토어용 아님). 휴대폰에서 받아 설치하세요. 빌드: ${GITHUB_SHA}" \
            --prerelease
